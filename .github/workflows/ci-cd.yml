name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build and test auth-service
      run: |
        cd services/auth-service
        ../gradlew build

    - name: Build and test user-service
      run: |
        cd services/user-service
        ../gradlew build

    - name: Build and test dataTable-service
      run: |
        cd services/dataTable-service
        ../gradlew build

    - name: Build and test api-gateway
      run: |
        cd services/api-gateway
        ../gradlew build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push auth-service
      uses: docker/build-push-action@v5
      with:
        context: ./services/auth-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/salary-app-auth-service:latest

    - name: Build and push user-service
      uses: docker/build-push-action@v5
      with:
        context: ./services/user-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/salary-app-user-service:latest

    - name: Build and push dataTable-service
      uses: docker/build-push-action@v5
      with:
        context: ./services/dataTable-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/salary-app-datatable-service:latest

    - name: Build and push api-gateway
      uses: docker/build-push-action@v5
      with:
        context: ./services/api-gateway
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/salary-app-api-gateway:latest