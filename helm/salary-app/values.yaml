# Default values for salary-app
replicaCount: 2

image:
  registry: your-registry
  tag: "latest"

config:
  jwtSigningKey: "mySecretKey"
  dbUsername: "postgres"
  dbPassword: "2580"

services:
  auth:
    port: 8081
  user:
    port: 8082
  datatable:
    port: 8084
  gateway:
    port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: salary-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []