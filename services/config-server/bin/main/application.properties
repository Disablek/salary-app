spring.application.name=config-server
server.port=8888

# Git configuration (optional - only used if 'git' profile is enabled)
spring.cloud.config.server.git.uri=https://github.com/Disablek/config-server-onlineCourses_project-.git
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.timeout=5

# Native profile - use local file system as fallback
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./config-repo,file:/config-repo

eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

management.endpoints.web.exposure.include=health,info