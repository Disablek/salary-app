spring.web.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.application.name=auth-service
spring.config.import=optional:configserver:http://config-server:8888
spring.cloud.config.fail-fast=false

spring.datasource.url=jdbc:postgresql://postgres:5432/auth_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2580}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# JWT
token.signing.key=${TOKEN_SIGNING_KEY:wQrd5gfnUzAHa9Woqf3KgkI5r0VYFhv5u2ZpFjS6m7U=}

# OpenAPI
# springdoc.swagger-ui.enabled=false

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/


# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

logging.level.root=INFO
logging.level.by.bntu.salaryapp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

server.port=8081

spring.cloud.config.uri=http://config-server:8888
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
