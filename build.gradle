// Aggregator project. Each microservice under services/* declares its own
// Spring Boot configuration, so this root build only ensures consistent
// Java toolchain and disables tasks that would otherwise try to run on
// the (empty) root project.

plugins {
    id 'java'
}

group = 'by.bntu'
version = '0.0.1-SNAPSHOT'
description = 'salary-app'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

tasks.named('test') {
    enabled = false
}
